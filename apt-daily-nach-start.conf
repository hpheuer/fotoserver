# Drop-in fuer apt-daily.timer: Paketlisten 5 Minuten nach dem Start holen.
#
# Der Rechner laeuft meist nur eine Stunde am Morgen.  Der Ubuntu-Zeitplan
# (6 und 18 Uhr, bis zu 12 Stunden Zufallsversatz) traf fast immer die Zeit,
# in der er aus ist - die Sicherheitsupdates sahen dann tagelang alte Listen
# und meldeten "keine Pakete".  Von einrichten.sh nach
# /etc/systemd/system/apt-daily.timer.d/ kopiert.
[Timer]
OnBootSec=5min
