# Drop-in fuer apt-daily-upgrade.timer: Sicherheitsupdates 20 Minuten nach
# dem Start einspielen - nach dem Holen der Listen (apt-daily, 5 min) und
# weit vor dem Herunterfahren.  Kommt der Halt doch dazwischen, wartet
# unattended-upgrade-shutdown, bis das Paket fertig ist.  Von einrichten.sh
# nach /etc/systemd/system/apt-daily-upgrade.timer.d/ kopiert.
[Timer]
OnBootSec=20min
