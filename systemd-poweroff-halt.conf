#  Jedes Ausschalten wird zu einem Halt.
#
#  Nach /etc/systemd/system/systemd-poweroff.service.d/fotoserver-halt.conf
#  kopieren - das erledigt "Fotoserver einrichten" (einrichten.sh, Schritt 6).
#
#  Warum:  Das BIOS des ProDesk 400 G3 kennt nur "After Power Loss: Power
#  On", und dieses Merkmal setzt es nur, wenn der Strom im laufenden
#  Betrieb verschwindet.  Nach einem echten poweroff steht das Board in S5,
#  der spaetere Stromausfall zaehlt nicht, und beim Einschalten der Dose
#  bliebe der Rechner aus - hochfahren ginge nur noch am Knopf am Geraet.
#  Bei einem Halt ist das Board aus seiner Sicht an, und die Steckdose
#  bleibt der Einschalter.
#
#  systemd-poweroff.service und systemd-halt.service unterscheiden sich in
#  genau dieser einen Zeile; mehr braucht es nicht.  Der Weg ueber den
#  Ausschaltknopf am Desktop (logind PowerOff) landet damit ebenfalls im
#  Halt, ohne dass GNOME etwas davon wissen muss.
#
#  Neustarts sind nicht betroffen - die laufen ueber systemd-reboot.service.

[Unit]
SuccessAction=halt-force
